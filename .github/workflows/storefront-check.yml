name: Validate proof-backed commercial storefront

on:
  pull_request:
    paths:
      - "index.html"
      - "vesper-intake.html"
      - "vesper-intake.js"
      - "assets/vesper-avatar.svg"
      - "assets/launch-v2.css"
      - "assets/launch-v2.js"
      - "products/**"
      - "assets/dio-config.js"
      - "assets/site.js"
      - ".github/workflows/storefront-check.yml"
  workflow_dispatch:

jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate investor launch skeleton
        run: |
          node --check assets/launch-v2.js
          node --check vesper-intake.js
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          for filename in ("index.html", "vesper-intake.html"):
              parser = HTMLParser()
              parser.feed(Path(filename).read_text(encoding="utf-8"))
              parser.close()

          root = Path("index.html").read_text(encoding="utf-8")
          required = (
              "AI workflows are easy to build.",
              "Exam & Assessment Studio",
              "Performance Evidence Studio",
              "Research Integrity Studio",
              "Evidence Assurance",
              "Programme Assurance",
              "Website Launch Studio",
              'id="launchIntakeForm"',
              "data-vesper-link",
          )
          for token in required:
              if token not in root:
                  raise SystemExit(f"launch skeleton missing: {token}")

          config = Path("assets/dio-config.js").read_text(encoding="utf-8")
          social_urls = (
              "https://www.instagram.com/dio_workflows/",
              "https://www.facebook.com/profile.php?id=61593271043069",
              "https://www.linkedin.com/company/139354569/",
              "https://www.youtube.com/channel/UCc916iuoPLseg05t5J5leaQ",
          )
          for url in social_urls:
              if url not in config:
                  raise SystemExit(f"social route missing: {url}")
          if "/admin/" in config:
              raise SystemExit("public LinkedIn route must not point to admin dashboard")
          if "https://dio-edge-gateway-live.dio-workflows.workers.dev/api/public/intake" not in config:
              raise SystemExit("governed public intake endpoint drifted")

          avatar = Path("assets/vesper-avatar.svg").read_text(encoding="utf-8")
          if "PORTRAIT PENDING" not in avatar or "data:image" in avatar:
              raise SystemExit("Vesper skeleton must use the neutral portrait placeholder")

          chat = Path("vesper-intake.js").read_text(encoding="utf-8")
          for endpoint in ("/api/vesper/chat/products", "/api/vesper/chat/session", "/api/vesper/chat/message"):
              if endpoint not in chat:
                  raise SystemExit(f"Vesper API contract missing: {endpoint}")
          if 'params.get("incarnation")' not in chat:
              raise SystemExit("Vesper product-context binding missing")
          if "assets/vesper-avatar.svg" not in chat:
              raise SystemExit("Vesper chat avatar hook missing")

          print("DIO_PUBLIC_LAUNCH_SKELETON_VERIFIED")
          PY
      - name: Validate 38-offer commercial catalog
        run: |
          node - <<'NODE'
          const fs = require('fs');
          global.window = {};
          require('./products/catalog.js');
          const rows = window.DIO_PRODUCT_CATALOG;
          if (!Array.isArray(rows) || rows.length !== 38) throw new Error(`expected 38 offers, found ${rows && rows.length}`);
          const slugs = new Set(rows.map(x => x.slug));
          if (slugs.size !== 38) throw new Error('product slugs are not unique');
          for (const p of rows) {
            for (const key of ['slug','name','family','headline','buyer','offer','boundary','proof']) {
              if (!String(p[key] || '').trim()) throw new Error(`${p.slug || '<unknown>'}: missing ${key}`);
            }
            if (!Array.isArray(p.bring) || p.bring.length < 3) throw new Error(`${p.slug}: needs 3 pilot inputs`);
            if (!Array.isArray(p.deliverables) || p.deliverables.length < 3) throw new Error(`${p.slug}: needs 3 deliverables`);
            const permanentPage = `products/${p.slug}/index.html`;
            if (!fs.existsSync(permanentPage)) throw new Error(`${p.slug}: permanent public pilot route missing`);
          }
          const highRisk = rows.filter(p => p.family === 'High-Risk Review');
          if (highRisk.length !== 9) throw new Error(`expected 9 high-risk review offers, found ${highRisk.length}`);
          if (highRisk.some(p => !p.proof.includes('domain engine intentionally unassigned'))) throw new Error('high-risk page lost no-engine truth boundary');
          const change = rows.find(p => p.slug === 'changeproof');
          if (!change || !change.boundary.includes('not generic enterprise change management')) throw new Error('ChangeProof scope ceiling missing');
          console.log(`COMMERCIAL_STORE_FRONT_READY products=${rows.length} permanent_routes=${rows.length} high_risk=${highRisk.length}`);
          NODE
      - name: Validate pricing, positioning and one-ingress contract
        run: |
          test -f products/index.html
          test -f products/product.css
          test -f products/app.js
          grep -q "'Documents & Rooms':4900" products/app.js
          grep -q "'Evidence & Assurance':7900" products/app.js
          grep -q "'Obligations':8900" products/app.js
          grep -q "'AI & Digital Trust':12900" products/app.js
          grep -q "'Regulated Operations':14900" products/app.js
          grep -q "GRC · audit readiness · evidence automation" products/app.js
          grep -q "AI governance · model risk · agent authority · auditability" products/app.js
          grep -q "38 controlled offer routes" products/index.html
          grep -q "CUSTOMER OUTCOMES FIRST" products/index.html
          grep -q "intakeEndpoint: \"https://dio-edge-gateway-live.dio-workflows.workers.dev/api/public/intake\"" assets/dio-config.js
          grep -q "product_class:requestedClass" assets/site.js
          grep -q "launch_price_zar" assets/site.js
          grep -q "document_studio" assets/site.js
          grep -q "pricing_basis" assets/site.js
          grep -q "EXPLORE 38 PILOTS" assets/site.js
          grep -q -- "--paper:#fff" products/product.css
          if grep -q "mailto:" products/app.js; then echo "product class CTA bypasses governed intake"; exit 1; fi
      - name: Validate permanent page shell
        run: |
          node - <<'NODE'
          const fs=require('fs');
          global.window={};
          require('./products/catalog.js');
          for(const p of window.DIO_PRODUCT_CATALOG){
            const html=fs.readFileSync(`products/${p.slug}/index.html`,'utf8');
            if(!html.includes('catalog.js') || !html.includes('app.js')) throw new Error(`${p.slug}: dynamic commercial shell missing`);
          }
          console.log('PERMANENT_PRODUCT_SHELLS_READY=38');
          NODE
