name: Validate proof-backed commercial storefront
on:
  pull_request:
    paths:
      - "index.html"
      - "vesper-intake.html"
      - "vesper-intake.js"
      - "products/**"
      - "assets/dio-config.js"
      - "assets/site.js"
      - ".github/workflows/storefront-check.yml"
  workflow_dispatch:
jobs:
  storefront:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate launch skeleton and governed intake
        run: |
          node --check assets/launch-v2.js
          node --check vesper-intake.js
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          for filename in ('index.html','vesper-intake.html','products/index.html'):
              parser=HTMLParser();parser.feed(Path(filename).read_text(encoding='utf-8'));parser.close()
          root=Path('index.html').read_text(encoding='utf-8')
          for token in ('launchIntakeForm','data-vesper-link','68','53 base canon + 15 canon extensions','159 / 159','governed consequence'):
              if token not in root: raise SystemExit(f'launch skeleton missing: {token}')
          config=Path('assets/dio-config.js').read_text(encoding='utf-8')
          for url in ('https://www.instagram.com/dio_workflows/','https://www.facebook.com/profile.php?id=61593271043069','https://www.linkedin.com/company/139354569/','https://www.youtube.com/channel/UCc916iuoPLseg05t5J5leaQ'):
              if url not in config: raise SystemExit(f'social route missing: {url}')
          if 'https://dio-edge-gateway-live.dio-workflows.workers.dev/api/public/intake' not in config:
              raise SystemExit('governed public intake endpoint drifted')
          print('DIO_PUBLIC_LAUNCH_SKELETON_VERIFIED')
          PY
      - name: Validate canonical catalog and truth boundaries
        run: |
          node - <<'NODE'
          const fs=require('fs');global.window={};require('./products/catalog.js');
          const rows=window.DIO_PRODUCT_CATALOG;
          if(rows.length!==68) throw new Error(`expected 68 offers/instruments, got ${rows.length}`);
          if(new Set(rows.map(x=>x.slug)).size!==68) throw new Error('duplicate product slugs');
          const base=rows.filter(p=>p.tier!=='canon_extension');
          const extensions=rows.filter(p=>p.tier==='canon_extension');
          if(base.length!==53) throw new Error(`expected 53 base-canon routes, got ${base.length}`);
          if(extensions.length!==15) throw new Error(`expected 15 canon extensions, got ${extensions.length}`);
          for(const p of rows){
            if(!fs.existsSync(`products/${p.slug}/index.html`)) throw new Error(`${p.slug}: permanent route missing`);
            if(p.commercialValidation!=='UNPROVED') throw new Error(`${p.slug}: commercial validation inflated`);
          }
          for(const p of base){
            if(p.verifiedVariantCount!==3||p.variantCount!==3) throw new Error(`${p.slug}: base-canon 3/3 proof missing`);
          }
          for(const p of extensions){
            if(p.status!=='CANON_EXTENSION_PROOF_CANDIDATE') throw new Error(`${p.slug}: canon extension status drifted`);
          }
          console.log('COMMERCIAL_STORE_FRONT_READY products=68 base=53 extensions=15');
          NODE
