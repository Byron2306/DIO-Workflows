name: Validate Vesper public web bridge

on:
  pull_request:
    paths:
      - "vesper-intake.html"
      - "vesper-intake.js"
      - "assets/dio-config.js"
      - "assets/final-polish.css"
      - ".github/workflows/vesper-visual-check.yml"
  workflow_dispatch:

jobs:
  vesper-public-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public web contract and speaking state
        run: |
          node --check vesper-intake.js
          python3 - <<'PY'
          from pathlib import Path

          html = Path("vesper-intake.html").read_text(encoding="utf-8")
          js = Path("vesper-intake.js").read_text(encoding="utf-8")
          config = Path("assets/dio-config.js").read_text(encoding="utf-8")

          for token in (
              'id="vesperPortraitWrap"',
              'class="vesper-sidebar-presence"',
              '@keyframes vesperPulse',
              'prefers-reduced-motion:reduce',
              'id="message" maxlength="4000"',
              'assets/final-polish.css',
          ):
              if token not in html:
                  raise SystemExit(f"Vesper HTML/CSS contract missing: {token}")

          if '.vesper-sidebar-presence.is-speaking::before' not in html and '.vesper-sidebar-presence.is-speaking:before' not in html:
              raise SystemExit('Vesper speaking presence pseudo-element contract missing')

          for retired in ('/api/vesper/chat/session','/api/vesper/chat/message','/api/vesper/chat/products'):
              if retired in js:
                  raise SystemExit(f"retired Vesper chat contract returned: {retired}")

          for token in (
              'function pulseVesper',
              'classList.add("is-speaking")',
              'classList.remove("is-speaking")',
              '/api/vesper/web/session',
              '/api/vesper/web/message',
              '/api/vesper/web/replies',
              'X-Vesper-Session-Token',
              'messageMode = "text"',
              'message_mode: messageMode',
              'pulseVesper();',
          ):
              if token not in js:
                  raise SystemExit(f"Vesper public web contract missing: {token}")

          if 'vesperPresenceApiOrigin' not in config or 'dio-presence-gateway-public.dio-workflows.workers.dev' not in config:
              raise SystemExit('Vesper public presence API origin missing')

          print("VESPER_PUBLIC_WEB_BRIDGE_VERIFIED")
          PY
