name: Validate premium DIO asset integration

on:
  pull_request:
    paths:
      - "index.html"
      - "vesper-intake.html"
      - "assets/launch-v2.css"
      - "assets/launch-v2.js"
      - "assets/premium/**"
      - "assets/dio-frame-tracer.svg"
      - "assets/dio-visual-system.css"
      - ".github/workflows/premium-assets-check.yml"
  workflow_dispatch:

jobs:
  premium-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate premium library, hero hierarchy and motion wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path

          required = {
              'assets/premium/dio-eye-premium.webp': 50000,
              'assets/premium/dio-orbit-vertical.webp': 50000,
              'assets/premium/dio-title-banner.webp': 100000,
              'assets/premium/dio-eye-divider.webp': 100000,
              'assets/premium/dio-panel-frame.webp': 150000,
              'assets/premium/dio-orbit-frame.webp': 150000,
              'assets/premium/icons/dio-icon-education.webp': 10000,
              'assets/premium/icons/dio-icon-growth.webp': 10000,
              'assets/premium/icons/dio-icon-evidence.webp': 10000,
              'assets/premium/icons/dio-icon-governance.webp': 10000,
              'assets/premium/icons/dio-icon-workflow.webp': 10000,
              'assets/premium/icons/dio-icon-media.webp': 10000,
              'assets/premium/icons/dio-icon-conversation.webp': 10000,
              'assets/dio-frame-tracer.svg': 1000,
          }
          for filename, minimum in required.items():
              p = Path(filename)
              if not p.exists():
                  raise SystemExit(f'premium asset missing: {filename}')
              if p.stat().st_size < minimum:
                  raise SystemExit(f'premium asset unexpectedly small: {filename}')

          shared = Path('assets/dio-visual-system.css').read_text(encoding='utf-8')
          if "@import url('premium/premium.css')" in shared:
              raise SystemExit('premium stylesheet must load after the base visual system, not before it via @import')
          home = Path('index.html').read_text(encoding='utf-8')
          for alias in ('id="control"','id="contact"'):
              if alias not in home:
                  raise SystemExit(f'legacy homepage anchor alias missing: {alias}')
          if home.index('assets/dio-visual-system.css') > home.index('assets/premium/premium.css'):
              raise SystemExit('homepage premium stylesheet does not load after the base visual system')
          vesper = Path('vesper-intake.html').read_text(encoding='utf-8')
          if vesper.index('assets/dio-visual-system.css') > vesper.index('assets/premium/premium.css'):
              raise SystemExit('Vesper premium stylesheet does not load after the base visual system')
          app = Path('products/app.js').read_text(encoding='utf-8')
          if app.index('assets/dio-visual-system.css') > app.index('assets/premium/premium.css'):
              raise SystemExit('product premium stylesheet is not appended after the base visual system')
          if 'premium-card-medallion' not in app or 'premium-family-medallion' not in app:
              raise SystemExit('product renderer does not emit premium medallions')

          premium = Path('assets/premium/premium.css').read_text(encoding='utf-8')
          required_tokens = (
              'dio-eye-premium.webp','dio-orbit-vertical.webp','dio-title-banner.webp',
              'dio-eye-divider.webp','dio-panel-frame.webp','dio-orbit-frame.webp',
              'dio-frame-tracer.svg','launch-hero.webp',
              '.investor-hero:before','.investor-stage.hero-media:after','.hero-brand-eye','mix-blend-mode:screen',
              '.launch-product-card:nth-child(1):after','.launch-product-card:nth-child(6):after',
              '.card-orbit .family-icon','.product-orbit-stage','.vesper-portrait-wrap.is-speaking',
              '.vesper-welcome','@keyframes dioEyeBreath','@keyframes dioMedallionFloat',
              '@keyframes dioFrameSpeak','.premium-frame-tracer'
          )
          for token in required_tokens:
              if token not in premium:
                  raise SystemExit(f'premium motion wiring missing: {token}')

          tracer = Path('assets/dio-frame-tracer.svg').read_text(encoding='utf-8')
          for token in ('stroke-dasharray','animate attributeName="stroke-dashoffset"','feGaussianBlur'):
              if token not in tracer:
                  raise SystemExit(f'animated frame tracer missing: {token}')

          if 'prefers-reduced-motion:reduce' not in premium:
              raise SystemExit('premium motion does not respect reduced-motion preference')

          print('DIO_PREMIUM_ASSET_MOTION_VERIFIED')
          PY
