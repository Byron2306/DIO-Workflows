name: Run deterministic gilded proof migration
on:
  push:
    branches: [finish/gilded-68-live-proof]
    paths: ['.github/workflows/apply-gilded-live-proof-v3.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: finish/gilded-68-live-proof
          fetch-depth: 0
      - name: Apply migration
        run: python3 scripts/apply_gilded_live_proof.py
      - name: Verify runtime and all public evidence
        run: |
          node --check products/app.js
          python3 tests/test_public_extension_live_proof_contract.py
      - name: Commit site finish and remove migration machinery
        shell: bash
        run: |
          git config user.name "DIO Site Finisher"
          git config user.email "132565250+Byron2306@users.noreply.github.com"
          git add products/app.js products/proof-layer.css assets/dio-visual-system.css
          git rm .github/workflows/apply-gilded-live-proof.yml .github/workflows/apply-gilded-live-proof-v2.yml .github/workflows/apply-gilded-live-proof-v3.yml scripts/apply_gilded_live_proof.py
          git commit -m "site: wire real 15-extension proof and gilded typography"
          git push origin HEAD:finish/gilded-68-live-proof
