name: Validate editorial evidence product pages
on:
  pull_request:
    paths:
      - "products/**"
      - "assets/**"
      - "tests/test_public_extension_live_proof_contract.py"
      - ".github/workflows/product-editorial-evidence.yml"
  workflow_dispatch:
jobs:
  editorial-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Validate proof-rich product presentation
        run: |
          node --check products/app.js
          node - <<'NODE'
          const fs=require('fs');global.window={};require('./products/catalog.js');
          const rows=window.DIO_PRODUCT_CATALOG;
          if(rows.length!==68) throw new Error(`expected 68 routes, got ${rows.length}`);
          const app=fs.readFileSync('products/app.js','utf8');
          for(const token of ['PRODUCTION PROOF','TRUTH BOUNDARY','BUYER JOB','OPEN / DOWNLOAD','MARKET VALIDATION','68-product portfolio','vesper-intake.html'])
            if(!app.includes(token)) throw new Error(`renderer missing: ${token}`);
          const css=fs.readFileSync('products/proof-layer.css','utf8');
          for(const token of ['.live-proof-grid','.proof-artifact-card','@media']) if(!css.includes(token)) throw new Error(`proof CSS missing: ${token}`);
          console.log('DIO_EDITORIAL_EVIDENCE_PRODUCT_CONTRACT_VERIFIED');
          NODE
          python3 - <<'PY'
          from pathlib import Path
          for slug,vid in [('homs','nbwAAprx6RY'),('evidex','h9QOiyaMJeM')]:
              page=Path(f'products/{slug}/index.html').read_text(encoding='utf-8')
              for token in ('editorial-hero','PRODUCTION PROOF','vesper-conversion',f'youtube-nocookie.com/embed/{vid}'):
                  if token not in page: raise SystemExit(f'{slug} flagship missing: {token}')
          print('DIO_FLAGSHIP_EVIDENCE_FILMS_VERIFIED')
          PY
      - name: Validate 15-extension live proof and gilded typography
        run: python3 tests/test_public_extension_live_proof_contract.py
