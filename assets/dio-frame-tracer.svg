<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="Animated DIO gold frame tracer">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8d6c31" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#f1d79b" stop-opacity=".95"/>
      <stop offset="1" stop-color="#b68a42" stop-opacity=".22"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="16" y="16" width="968" height="588" rx="20" fill="none" stroke="#d9b66f" stroke-opacity=".17" stroke-width="1"/>
  <rect x="18" y="18" width="964" height="584" rx="18" fill="none" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-dasharray="90 1370" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" from="0" to="-2920" dur="9s" repeatCount="indefinite"/>
  </rect>
  <g fill="#f1d79b" filter="url(#glow)">
    <circle cx="18" cy="18" r="3"><animate attributeName="opacity" values=".2;1;.2" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="982" cy="18" r="3"><animate attributeName="opacity" values="1;.2;1" dur="8s" repeatCount="indefinite"/></circle>
    <circle cx="18" cy="602" r="3"><animate attributeName="opacity" values=".3;1;.3" dur="8.5s" repeatCount="indefinite"/></circle>
    <circle cx="982" cy="602" r="3"><animate attributeName="opacity" values="1;.25;1" dur="7.5s" repeatCount="indefinite"/></circle>
  </g>
  <g stroke="#d9b66f" stroke-opacity=".44" fill="none" stroke-width="1.5">
    <path d="M18 82V18h64M918 18h64v64M18 538v64h64M918 602h64v-64"/>
  </g>
</svg>
