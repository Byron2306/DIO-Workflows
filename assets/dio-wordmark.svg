<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 150" role="img" aria-labelledby="title desc">
  <title id="title">DIO</title>
  <desc id="desc">DIO corporate occult gold wordmark.</desc>
  <defs>
    <linearGradient id="dioGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5c9"/>
      <stop offset=".2" stop-color="#f1d79b"/>
      <stop offset=".46" stop-color="#c3923f"/>
      <stop offset=".7" stop-color="#81551f"/>
      <stop offset="1" stop-color="#ffe6a1"/>
    </linearGradient>
    <radialGradient id="dioAperture" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff0b7"/>
      <stop offset=".2" stop-color="#dfb95f"/>
      <stop offset=".48" stop-color="#7e5422"/>
      <stop offset="1" stop-color="#030303"/>
    </radialGradient>
    <filter id="dioGlow" x="-18%" y="-40%" width="136%" height="180%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.94 0 1 0 0 0.69 0 0 1 0 0.30 0 0 0 .34 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000" flood-opacity=".72"/>
    </filter>
  </defs>

  <rect width="560" height="150" fill="none"/>

  <g filter="url(#dioGlow)">
    <path d="M20 74h102M438 74h102" stroke="#d9b66f" stroke-width="2.2" opacity=".44"/>
    <path d="M48 45h58M454 45h58M48 105h58M454 105h58" stroke="#f1d79b" stroke-width="1" opacity=".30"/>
    <circle cx="128" cy="74" r="4.5" fill="#d9b66f" opacity=".72"/>
    <circle cx="432" cy="74" r="4.5" fill="#d9b66f" opacity=".72"/>
    <circle cx="128" cy="74" r="11" fill="none" stroke="#d9b66f" stroke-width="1" opacity=".30"/>
    <circle cx="432" cy="74" r="11" fill="none" stroke="#d9b66f" stroke-width="1" opacity=".30"/>

    <text x="280" y="109"
      text-anchor="middle"
      fill="url(#dioGold)"
      stroke="#160d03"
      stroke-width="1.2"
      paint-order="stroke fill"
      filter="url(#innerShadow)"
      font-family="'Noto Serif Display', 'Noto Serif', Georgia, 'Times New Roman', serif"
      font-size="116"
      font-weight="900"
      letter-spacing="18">DIO</text>

    <g transform="translate(323 72)">
      <circle cx="0" cy="0" r="31" fill="none" stroke="#d9b66f" stroke-width="1" opacity=".34"/>
      <circle cx="0" cy="0" r="20" fill="none" stroke="#f1d79b" stroke-width=".75" opacity=".35"/>
      <path d="M-40 0C-17-16 17-16 40 0C17 16-17 16-40 0Z" fill="none" stroke="#f6d88d" stroke-width="1.4" opacity=".48"/>
      <circle cx="0" cy="0" r="6.5" fill="url(#dioAperture)" opacity=".84"/>
      <path d="M0-40V40M-46 0H46" stroke="#f1d79b" stroke-width=".75" opacity=".32"/>
    </g>

    <path d="M154 125h252" stroke="#d9b66f" stroke-width="1.3" opacity=".28"/>
    <path d="M188 26h184" stroke="#f1d79b" stroke-width=".9" opacity=".18"/>
  </g>
</svg>
