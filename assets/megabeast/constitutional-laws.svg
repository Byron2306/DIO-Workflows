text x="325.0" y="458" text-anchor="middle" class="t" font-size="24">Fulfilment ≠ Customer Value</text><rect x="610" y="420" width="470" height="88" rx="18" class="node"/><text x="845.0" y="458" text-anchor="middle" class="t" font-size="24">One customer ≠ Repeatability</text><rect x="90" y="535" width="470" height="88" rx="18" class="node"/><text x="325.0" y="573" text-anchor="middle" class="t" font-size="24">Similarity ≠ Capability</text><rect x="610" y="535" width="470" height="88" rx="18" class="node"/><text x="845.0" y="573" text-anchor="middle" class="t" font-size="24">Learning ≠ Permission</text><rect x="1110" y="175" width="385" height="72" rx="18" class="node"/><text x="1302.5" y="213" text-anchor="middle" class="t" font-size="24">Harmonic Governance</text><text x="1302.5" y="243" text-anchor="middle" class="s" font-size="13">pressure &amp; scrutiny</text><rect x="1110" y="267" width="385" height="72" rx="18" class="node"/><text x="1302.5" y="305" text-anchor="middle" class="t" font-size="24">Seraph</text><text x="1302.5" y="335" text-anchor="middle" class="s" font-size="13">clear · hold · refuse</text><rect x="1110" y="359" width="385" height="72" rx="18" class="node"/><text x="1302.5" y="397" text-anchor="middle" class="t" font-size="24">Valinor</text><text x="1302.5" y="427" text-anchor="middle" class="s" font-size="13">SOLE SOVEREIGN AUTHORITY</text><rect x="1110" y="451" width="385" height="72" rx="18" class="node"/><text x="1302.5" y="489" text-anchor="middle" class="t" font-size="24">ARDA</text><text x="1302.5" y="519" text-anchor="middle" class="s" font-size="13">identity &amp; attestation</text><rect x="1110" y="543" width="385" height="72" rx="18" class="node"/><text x="1302.5" y="581" text-anchor="middle" class="t" font-size="24">Governed Executor</text><text x="1302.5" y="611" text-anchor="middle" class="s" font-size="13">bounded execution</text><rect x="1110" y="635" width="385" height="72" rx="18" class="node"/><text x="1302.5" y="673" text-anc